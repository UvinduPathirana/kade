<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant | Kadé</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/restaurant.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8L12 3Z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.7.8 3 2.6 3.5 5.2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v7h14v-7"/></symbol>
  </svg>

  <a class="skip-link" href="#menu">Skip to menu</a>

  <header class="site-header is-scrolled" id="header">
    <div class="wrap site-header__row">
      <a class="wordmark" href="index.html" aria-label="Kadé home">kadé</a>

      <button class="address-btn" type="button" aria-haspopup="dialog">
        <svg class="icon"><use href="#i-pin"/></svg>
        <span>42 Galle Rd, Colombo 03</span>
        <svg class="icon" style="width:16px;height:16px"><use href="#i-down"/></svg>
      </button>

      <div class="header-actions">
        <a class="icon-btn account-btn" href="#" aria-label="Account">
          <svg class="icon"><use href="#i-user"/></svg>
        </a>
        <button class="cart-btn" type="button" aria-haspopup="dialog" aria-controls="cart" data-cart-open>
          <svg class="icon"><use href="#i-bag"/></svg>
          <span class="cart-btn__label">Cart</span>
          <span class="cart-btn__count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" data-store>
    <!-- Filled by restaurant.js -->
  </main>

  <div class="order-bar" data-order-bar hidden>
    <button type="button" data-cart-open>
      <span class="order-bar__count" data-cart-count>0</span>
      <span>View order</span>
      <span data-order-bar-total></span>
    </button>
  </div>

  <dialog class="sheet" id="item" aria-labelledby="item-title" data-item-dialog></dialog>

  <div class="scrim" data-scrim></div>
  <aside class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title" data-cart></aside>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/restaurant.js"></script>
</body>
</html>
