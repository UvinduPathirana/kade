# Compose fragment for gateway-rider (rider app BFF). Included from deploy/compose/services.yaml;
# paths are relative to this file.
#   docker compose -f deploy/compose/compose.yaml --profile fulfilment up -d --build gateway-rider
services:
  gateway-rider:
    image: kade/gateway-rider:dev
    build:
      context: ../..
      dockerfile: gateways/rider/Dockerfile
    profiles: [fulfilment]
    environment:
      SERVICE_NAME: gateway-rider
      HTTP_PORT: "8203"
      DISPATCH_GRPC: dispatch:50110
      LOCATION_GRPC: location:50111
      LEDGER_GRPC: ledger:50113
      REVIEW_GRPC: review:50115
      SUPPORT_GRPC: support:50116
      REALTIME_WS_URL: ws://realtime:8112/ws
      # Tokens carry the browser-facing issuer (KC_HOSTNAME); keys are fetched over the network.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/kade
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/kade/protocol/openid-connect/certs
      KEYCLOAK_CLIENTS: rider-app
      CORS_ORIGINS: http://localhost:5176
      # DEV ONLY: lets the apps call with "Bearer dev:<user>:<roles>" before Keycloak login exists.
      AUTH_DEV_BYPASS: "true"
      DEPLOY_ENV: dev
      # DEV ONLY: rider for rider users while dispatch.GetMyRider can't answer (Nimal).
      DEFAULT_RIDER_ID: 00000000-0000-7000-8001-000000000101
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "8203:8203"
    # Upstreams are not hard dependencies: routes answer 503 problems until each service is up.
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8203/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 160m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
