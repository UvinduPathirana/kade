# Compose fragment for the gateway template. Included from deploy/compose/services.yaml; paths are
# relative to this file. Real gateways: gateway-customer 8201, -merchant 8202, -rider 8203, -admin 8204.
#   docker compose -f deploy/compose/compose.yaml --profile templates up -d --build gateway-admin
services:
  gateway-admin:
    image: kade/gateway-admin:dev
    build:
      context: ../..
      dockerfile: gateways/_template/Dockerfile
    profiles: [engagement]
    environment:
      SERVICE_NAME: gateway-admin
      HTTP_PORT: "8204"
      TEMPLATE_GRPC: template-ts:50100
      # Tokens carry the browser-facing issuer (KC_HOSTNAME); keys are fetched over the network.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/kade
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/kade/protocol/openid-connect/certs
      KEYCLOAK_CLIENTS: customer-app
      CORS_ORIGINS: http://localhost:5177
      # DEV ONLY: lets the apps call with "Bearer dev:<user>:<roles>" before Keycloak login exists.
      AUTH_DEV_BYPASS: "true"
      DEPLOY_ENV: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "8204:8204"
    depends_on:
      template-ts: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8204/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 160m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
