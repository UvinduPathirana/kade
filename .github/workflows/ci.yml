name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ TypeScript (apps, packages, TS services)
  node:
    name: pnpm lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # ------------------------------------------------------------------ Protobuf contracts
  proto:
    name: buf lint / breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking reads main from .git
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: pnpm exec buf lint proto
      - name: buf breaking (against main)
        run: |
          # .git#branch=main needs a local "main" ref; actions/checkout only creates origin/main.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != main ]; then
            git fetch --no-tags origin +refs/heads/main:refs/heads/main
          fi
          if ! git cat-file -e main:proto/buf.yaml 2>/dev/null; then
            echo "::notice::main has no proto/ module yet; skipping buf breaking"
            exit 0
          fi
          pnpm exec buf breaking proto --against '.git#branch=main,subdir=proto'

  # ------------------------------------------------------------------ Go (every module in go.work)
  go:
    name: go vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: vet and test each workspace module
        run: |
          set -euo pipefail
          mapfile -t modules < <(go list -m -f '{{.Dir}}')
          failed=0
          for dir in "${modules[@]}"; do
            echo "::group::${dir#"$GITHUB_WORKSPACE"/}"
            (cd "$dir" && go vet ./... && go test -race -count=1 ./...) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  # ------------------------------------------------------------------ Java (every Gradle service)
  discover-java:
    name: discover Gradle projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          # services/<name>/build.gradle(.kts) and services/_templates/<lang>/build.gradle(.kts)
          projects=$(find services -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) \
                       -not -path '*/build/*' -not -path '*/node_modules/*' -exec dirname {} \; 2>/dev/null \
                     | sort -u \
                     | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "projects=${projects:-[]}" >> "$GITHUB_OUTPUT"
          echo "Gradle projects: ${projects:-[]}"

  java:
    name: gradle test (${{ matrix.project }})
    needs: discover-java
    if: needs.discover-java.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover-java.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6 # caches ~/.gradle (wrapper, deps, build cache)
        with:
          gradle-version: current # only used by projects without a ./gradlew wrapper
      - name: gradle test
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon test; else gradle --no-daemon test; fi
