# Compose fragment for profile. Included from deploy/compose/services.yaml;
# paths are relative to this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile ordering up -d --build profile
services:
  profile:
    image: kade/profile:dev
    build:
      context: ../..
      dockerfile: services/profile/Dockerfile
    profiles: [ordering]
    environment:
      SERVICE_NAME: profile
      GRPC_PORT: "50103"
      HTTP_PORT: "8103"
      DATABASE_URL: postgres://profile:profile@postgres:5432/profile
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      # Keycloak admin REST, in-network (phone sign-in). Token `iss` stays http://localhost:8080/realms/kade.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kade
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Dev OTP: no SMS; every code is 123456 (the apps' demo code).
      OTP_MODE: dev
      OTP_DEV_CODE: "123456"
      # Optional: SaveAddress resolves zone_id through pricing when reachable (failures are ignored).
      PRICING_GRPC: pricing:50105
      NOTIFICATION_GRPC: notification:50114
      SEED_DEMO_DATA: "true"
      # V8 sizes its heap from the host's RAM, not the cgroup; cap it well under the 192 MB limit
      # so GC kicks in before the OOM killer does (native librdkafka + buffers live outside it).
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "50103:50103"
      - "8103:8103"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      # busybox wget: no extra Node process (~40 MB) inside a 192 MB container every 10 s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8103/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # main.ts drains within SHUTDOWN_TIMEOUT_MS (10 s); give it that before SIGKILL.
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 192m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
