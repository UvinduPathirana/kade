# Compose fragment for cart. Included from deploy/compose/services.yaml;
# paths are relative to this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile ordering up -d --build cart
services:
  cart:
    image: kade/cart:dev
    build:
      context: ../..
      dockerfile: services/cart/Dockerfile
    profiles: [ordering]
    environment:
      SERVICE_NAME: cart
      GRPC_PORT: "50104"
      HTTP_PORT: "8104"
      REDIS_URL: redis://redis:6379
      CART_TTL_SECONDS: "604800"
      # Dependencies. Cart starts without them; calls that need one fail with <DEP>_UNAVAILABLE.
      CATALOG_GRPC: catalog:50101
      PRICING_GRPC: pricing:50105
      PROMOTION_GRPC: promotion:50106
      PROFILE_GRPC: profile:50103
      DOWNSTREAM_DEADLINE_MS: "2000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      # V8 sizes its heap from the host's RAM, not the cgroup; cap it well under the 192 MB limit
      # so GC kicks in before the OOM killer does.
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "50104:50104"
      - "8104:8104"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      # busybox wget: no extra Node process (~40 MB) inside a 192 MB container every 10 s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8104/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # main.ts drains within SHUTDOWN_TIMEOUT_MS (10 s); give it that before SIGKILL.
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 192m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
