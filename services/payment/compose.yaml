# Compose fragment for the Java service template. The lead includes it from deploy/compose/services.yaml;
# it also runs on its own against the shared stack:
#   docker compose -f services/payment/compose.yaml --profile templates up -d --build
# Paths are relative to this file.

services:
  payment:
    build:
      context: .
      additional_contexts:
        proto: ../../proto
    image: kade/payment:dev
    profiles: [templates]
    environment:
      SERVICE_NAME: payment
      GRPC_PORT: "50108"
      HTTP_PORT: "8108"
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    ports:
      - "50108:50108"
      - "8108:8108"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8108/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # No depends_on so the fragment also works stand-alone; the app exits if Postgres is unreachable at start
    # (Flyway) and Compose restarts it.
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
