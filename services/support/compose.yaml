# Compose fragment for support. Included from deploy/compose/services.yaml;
# paths are relative to this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile engagement up -d --build support
services:
  support:
    image: kade/support:dev
    build:
      context: ../..
      dockerfile: services/support/Dockerfile
    profiles: [engagement]
    environment:
      SERVICE_NAME: support
      GRPC_PORT: "50116"
      HTTP_PORT: "8116"
      DATABASE_URL: postgres://support:support@postgres:5432/support
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      ORDER_GRPC: order:50107
      PROFILE_GRPC: profile:50103
      # V8 sizes its heap from the host's RAM, not the cgroup; cap it well under the 192 MB limit
      # so GC kicks in before the OOM killer does (native librdkafka + buffers live outside it).
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "50116:50116"
      - "8116:8116"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      # busybox wget: no extra Node process (~40 MB) inside a 192 MB container every 10 s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8116/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # main.ts drains within SHUTDOWN_TIMEOUT_MS (10 s); give it that before SIGKILL.
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 192m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
