# Compose fragment for dispatch. Included from deploy/compose/services.yaml; paths are relative to
# this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile fulfilment up -d --build dispatch
# After the first start (migrations create public.outbox), register the outbox connector once:
#   deploy/compose/connect/register-outbox.sh dispatch dispatch
services:
  dispatch:
    build:
      context: ../..
      dockerfile: services/dispatch/Dockerfile
    image: kade/dispatch:dev
    profiles: [fulfilment]
    environment:
      SERVICE_NAME: dispatch
      GRPC_PORT: "50110"
      HTTP_PORT: "8110"
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      # Optional dependencies (lazy connections: dispatch runs fine while they are down).
      LOCATION_GRPC: location:50111         # simulated riders' positions → kade.rider.locations
      NOTIFICATION_GRPC: notification:50114 # rider → customer quick replies
      # Demo: the seeded fleet without logins accepts and runs its jobs; Nimal (real login) is
      # always offered first when he is online and nearby.
      SIMULATE_RIDERS: "true"
      PREFER_REAL_RIDERS: "true"
      SEED_ON_START: "true"
      OFFER_TIMEOUT: 30s
      GOMEMLIMIT: 72MiB # soft limit below the 96 MB cap: the GC works harder instead of OOM-killing
      GOMAXPROCS: "2"
    ports:
      - "50110:50110"
      - "8110:8110"
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"] # GET /health/ready (no curl in distroless)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 25s # > SHUTDOWN_TIMEOUT (20s default)
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 96m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
