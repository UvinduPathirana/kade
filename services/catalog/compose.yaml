# Compose fragment for catalog. Included from deploy/compose/services.yaml;
# paths are relative to this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile ordering up -d --build catalog
services:
  catalog:
    image: kade/catalog:dev
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    profiles: [ordering]
    environment:
      SERVICE_NAME: catalog
      GRPC_PORT: "50101"
      HTTP_PORT: "8101"
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      # Delivery fees for listings and zones for new locations; catalog falls back to stored values.
      PRICING_GRPC: pricing:50105
      # DEMO_TIME: "19:00"   # pin the Colombo time of day for opening hours in demos
      # V8 sizes its heap from the host's RAM, not the cgroup; cap it well under the 192 MB limit
      # so GC kicks in before the OOM killer does (native librdkafka + buffers live outside it).
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "50101:50101"
      - "8101:8101"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      # busybox wget: no extra Node process (~40 MB) inside a 192 MB container every 10 s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8101/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # main.ts drains within SHUTDOWN_TIMEOUT_MS (10 s); give it that before SIGKILL.
    stop_grace_period: 15s
    deploy: { resources: { limits: { memory: 192m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
