# Compose fragment for order. Included from deploy/compose/services.yaml;
# paths are relative to this file. Start it with the shared stack:
#   docker compose -f deploy/compose/compose.yaml --profile ordering up -d --build order
# Then, once: deploy/compose/connect/register-outbox.sh order orders
services:
  order:
    image: kade/order:dev
    build:
      context: ../..
      dockerfile: services/order/Dockerfile
    profiles: [ordering]
    environment:
      SERVICE_NAME: order
      GRPC_PORT: "50107"
      HTTP_PORT: "8107"
      DATABASE_URL: postgres://order:order@postgres:5432/orders
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_LEVEL: info
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: kade
      TEMPORAL_TASK_QUEUE: order
      ACCEPT_TIMEOUT_SECONDS: "180"
      SEED_DEMO_ORDERS: "true"
      CATALOG_GRPC: catalog:50101
      PROFILE_GRPC: profile:50103
      PRICING_GRPC: pricing:50105
      PROMOTION_GRPC: promotion:50106
      PAYMENT_GRPC: payment:50108
      # grpc = call the real service; stub = in-process stand-in (README "Dependency modes").
      # Promotion and payment (Java) arrive later: stubbed until then. Override per run, e.g.
      #   PAYMENT_MODE=grpc docker compose … up -d order
      CATALOG_MODE: ${ORDER_CATALOG_MODE:-grpc}
      PROFILE_MODE: ${ORDER_PROFILE_MODE:-grpc}
      PRICING_MODE: ${ORDER_PRICING_MODE:-grpc}
      PROMOTION_MODE: ${ORDER_PROMOTION_MODE:-stub}
      PAYMENT_MODE: ${ORDER_PAYMENT_MODE:-stub}
      # V8 sizes its heap from the host's RAM, not the cgroup; cap it well under the limit so GC
      # kicks in before the OOM killer does (librdkafka and the Temporal core live outside it).
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "50107:50107"
      - "8107:8107"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
    healthcheck:
      # /health/ready covers Postgres, Kafka and the Temporal worker.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8107/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    # main.ts drains within SHUTDOWN_TIMEOUT_MS (10 s); give it that before SIGKILL.
    stop_grace_period: 15s
    # Node + librdkafka + the Temporal worker's Rust core (workflow cache, sticky queue).
    deploy: { resources: { limits: { memory: 320m } } }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
    networks: [kade]

networks:
  kade:
    name: kade
    external: true
